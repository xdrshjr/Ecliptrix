<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Ecliptrix — 启动失败</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      padding: 32px 36px;
      background: #0b1020;
      color: #e7e9ee;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    h1 { font-size: 20px; margin-bottom: 14px; color: #ff8a8a; }
    p { font-size: 13px; line-height: 1.7; color: #9aa3b5; }
    .box {
      margin: 14px 0;
      padding: 12px 14px;
      background: #141a2e;
      border: 1px solid #232c4a;
      border-radius: 8px;
      font-size: 12px;
      font-family: Consolas, monospace;
      color: #c9d2e4;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .label { margin-top: 16px; font-size: 12px; color: #5b6478; }
  </style>
</head>
<body>
  <h1>启动失败</h1>
  <p id="summary">本地服务未能正常启动。</p>
  <div class="label">错误详情</div>
  <div class="box" id="detail">(无)</div>
  <div class="label">日志目录(先看 error.log 与 process.log;另有 config.log / main.log / backend.log / frontend.log)</div>
  <div class="box" id="logs">(未知)</div>
  <p>常见原因:配置文件中的必填项缺失、端口被占用、杀毒软件拦截了本地服务进程。修正后请重新启动应用。</p>
  <script>
    const params = new URLSearchParams(location.search)
    const service = params.get('service')
    if (service) {
      document.getElementById('summary').textContent = `本地服务「${service}」未能正常启动。`
    }
    const detail = params.get('detail')
    if (detail) document.getElementById('detail').textContent = detail
    const logs = params.get('logs')
    if (logs) document.getElementById('logs').textContent = logs
  </script>
</body>
</html>
