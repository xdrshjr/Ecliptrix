# electron-builder configuration for the Ecliptrix desktop shell.
# Spec: docs/plans/desktop-electron-packaging/spec.md §2.3 / §3.1
#
# The asar archive only contains the Electron shell (main/preload/assets +
# the first-run .env template). The heavyweight runtime pieces — Next.js
# standalone frontend, FastAPI backend sources, the embeddable CPython
# runtime and FFmpeg — are assembled into build/ by scripts/build.js and
# enter the package as extraResources (kept OUTSIDE asar so python.exe,
# ffmpeg.exe and Node can read them as plain files).
appId: com.ecliptrix.desktop
productName: Ecliptrix
electronLanguages:
  - zh-CN
  - en-US

directories:
  output: release
  buildResources: resources

files:
  - main/**
  - preload/**
  - assets/**
  - package.json
  # First-run .env template. Sourced from build/ (generated by
  # scripts/prepare-env.js with the bundled default credentials) rather than the
  # committed placeholder under scripts/, so real keys never touch a tracked
  # file. The `from` MUST be the build/ directory (not the file itself): the
  # asar file-set walker readdir()s `from` and treats a file path as an empty
  # directory, silently packaging nothing. The filter narrows it to the one
  # generated file, mapped to scripts/env.template.desktop inside the asar —
  # the path main/index.js resolves at first run.
  - from: build
    to: scripts
    filter:
      - env.template.desktop

asar: true

extraResources:
  - from: build/frontend
    to: frontend
  - from: build/backend
    to: backend
  - from: build/python
    to: python
  - from: build/ffmpeg
    to: ffmpeg

# The package embeds a full Python runtime + node server; nothing to rebuild.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  # v1 ships unsigned (spec §7 risk 7) — SmartScreen warning documented in README.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Ecliptrix
